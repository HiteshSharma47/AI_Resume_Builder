<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ResumeAI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 8%;
        }

        .login-box {
            background: #111;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid gray;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: transparent;
            border: 1px solid gray;
            color: white;
            border-radius: 5px;
        }

        .login-box input:focus {
            outline: none;
            border-color: purple;
        }

        .login-box button {
            width: 100%;
            margin-top: 10px;
        }

        .login-box p {
            margin-top: 20px;
            color: gray;
            font-size: 14px;
        }

        .login-box p a {
            color: purple;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <nav>
        <h2>Resume<span>AI</span></h2>
        <div>
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="about.html">About</a>
            <a href="dashboard.html">Dashboard</a>
        </div>
        <div class="nav-buttons">
            <button class="login" onclick="window.location.href='login.html'">Login</button>
            <button onclick="window.location.href='create.html'">Get Started</button>
        </div>
    </nav>

    <div class="login-container">
        <!--Login Feature-->
        <div class="login-box" id="login-form">
            <h2>Welcome Back</h2>
            <input type="email" placeholder="Email Address">
            <input type="password" placeholder="Password">
            <button>Login</button>
            <p>Don't have an account? <a href="#" onclick="toggle('signup')">Sign up</a></p>
        </div>

        <!--SignUp Feature-->
        <div class="login-box" id="signup-form" style="display: none;">
            <h2>Create Account</h2>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email Address">
            <input type="password" placeholder="Password">
            <button>Sign Up</button>
            <p>Already have an account? <a href="#" onclick="toggle('login')">Login</a></p>
        </div>
    </div>

    <script>
        function toggle(val) {
            if (val === 'login') {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('signup-form').style.display = 'none';
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('signup-form').style.display = 'block';
            }
        }
    </script>
</body>

</html>
