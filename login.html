<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ResumeAI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 8%;
        }
        .login-box {
            background: #111;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid gray;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h2 {
            margin-bottom: 25px;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: transparent;
            border: 1px solid gray;
            color: white;
            border-radius: 5px;
        }
        .login-box input:focus {
            outline: none;
            border-color: purple;
        }
        .login-box button {
            width: 100%;
            margin-top: 10px;
        }
        .login-box p {
            margin-top: 20px;
            color: gray;
            font-size: 14px;
        }
        .login-box p a {
            color: purple;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav>
        <h2>Resume<span>AI</span></h2>
        <div>
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="#">About</a>
        </div>
        <div class="nav-buttons">
            <button class="login" onclick="window.location.href='login.html'">Login</button>
            <button>Get Started</button>
        </div>
    </nav>
    
    <div class="login-container">
        <div class="login-box">
            <h2>Welcome Back</h2>
            <input type="email" placeholder="Email Address">
            <input type="password" placeholder="Password">
            <button>Login</button>
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </div>
</body>
</html>
